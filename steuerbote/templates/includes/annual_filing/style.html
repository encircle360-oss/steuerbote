{#-
	The style of the print formats of the annual documents: A4, black and grey, with classes of their own, since
	Frappe's print stylesheet styles bare classes such as label. A print format includes it first and wraps its
	content in <div class="sb-annual">.
-#}
<style>
	@page {
		size: A4 portrait;
		margin: 15mm 15mm 15mm 20mm;
	}

	.sb-annual {
		color: #000;
		font-size: 9pt;
		line-height: 1.35;
	}

	.sb-annual h1 {
		font-size: 15pt;
		font-weight: 600;
		margin: 0 0 1mm;
	}

	.sb-annual h2 {
		font-size: 10.5pt;
		font-weight: 600;
		margin: 6mm 0 2mm;
	}

	.sb-annual .sb-subtitle {
		color: #444;
		font-weight: 600;
		margin: 0 0 3mm;
	}

	.sb-annual table {
		width: 100%;
		border-collapse: collapse;
	}

	.sb-annual thead {
		display: table-header-group;
	}

	.sb-annual tr,
	.sb-annual .sb-group {
		break-inside: avoid;
		page-break-inside: avoid;
	}

	.sb-annual .sb-head {
		margin: 3mm 0 5mm;
	}

	.sb-annual .sb-label,
	.sb-annual .sb-value {
		padding: 0.8mm 2mm 0.8mm 0;
		text-align: left;
		vertical-align: top;
	}

	.sb-annual .sb-label {
		color: #555;
		white-space: nowrap;
		width: 58mm;
	}

	.sb-annual .sb-note {
		color: #444;
		margin: 0 0 4mm;
	}

	.sb-annual .sb-lines {
		table-layout: fixed;
	}

	.sb-annual .sb-lines th {
		border-bottom: 0.4mm solid #000;
		font-size: 8pt;
		font-weight: 600;
		padding: 1mm 1.5mm;
		text-align: left;
		vertical-align: bottom;
	}

	.sb-annual .sb-lines td {
		border-bottom: 0.2mm solid #bbb;
		padding: 1mm 1.5mm;
		vertical-align: top;
	}

	.sb-annual .sb-lines .sb-section td {
		background: #ececec;
		border-bottom: 0.3mm solid #888;
		font-weight: 600;
		padding-top: 1.8mm;
	}

	.sb-annual .sb-lines .sb-sum td {
		font-weight: 600;
	}

	.sb-annual .sb-lines .sb-empty td {
		color: #666;
	}

	.sb-annual .sb-code,
	.sb-annual .sb-kind {
		white-space: nowrap;
		width: 24mm;
	}

	.sb-annual .sb-ref {
		width: 32mm;
	}

	.sb-annual .sb-num,
	.sb-annual .sb-lines th.sb-num {
		text-align: right;
		white-space: nowrap;
		width: 28mm;
	}

	.sb-annual .sb-footer {
		border-top: 0.3mm solid #888;
		color: #444;
		font-size: 8pt;
		margin-top: 6mm;
		padding-top: 2mm;
	}

	.sb-annual .sb-footer p {
		margin: 0 0 1mm;
	}
</style>
