name: Funktion vorschlagen
description: Eine Meldung, ein Kontenrahmen oder eine Funktion fehlt.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag
      description: Wie könnte die Lösung aussehen? Welche Quelle beschreibt die fachliche Anforderung?
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options:
        - Umsatzsteuer-Voranmeldung
        - Dauerfristverlängerung und Sondervorauszahlung
        - Zusammenfassende Meldung
        - USt-IdNr.-Prüfung
        - Umsatzsteuererklärung
        - Körperschaft- und Gewerbesteuererklärung
        - E-Bilanz
        - Jahresabschluss und Offenlegung
        - Kontenrahmen, Kontenzuordnungen und Bilanzzuordnung
        - ERiC und Übermittlung
        - Fristen
        - Einrichtung
        - Dokumentation
        - Sonstiges
