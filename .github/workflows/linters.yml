name: Linters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Run pre-commit on all files
        env:
          SKIP: no-commit-to-branch
        run: |
          python -m pip install -r requirements-dev.txt
          pre-commit run --all-files --show-diff-on-failure

  semgrep:
    name: Frappe semgrep rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules decide whether the scan passes, so like the actions they come at one commit, and a newer
      # commit is an update by hand.
      - name: Check out the Frappe semgrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frappe/semgrep-rules
          ref: 81a6e3d47a328249e8ddf04c586e493dd5553002
          path: .semgrep/frappe
          persist-credentials: false

      - name: Check out the correctness rules for Python of the Semgrep registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          path: .semgrep/registry
          sparse-checkout: python/lang/correctness
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Run semgrep
        run: |
          pip install semgrep==1.185.0
          semgrep scan --error --config .semgrep/frappe/rules --config .semgrep/registry/python/lang/correctness steuerbote
