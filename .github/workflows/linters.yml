name: Linters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Run pre-commit on all files
        env:
          SKIP: no-commit-to-branch
        run: |
          python -m pip install -r requirements-dev.txt
          pre-commit run --all-files --show-diff-on-failure

  semgrep:
    name: Frappe semgrep rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Download the Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/frappe-semgrep-rules

      - name: Run semgrep
        run: |
          pip install semgrep==1.185.0
          semgrep scan --error --config /tmp/frappe-semgrep-rules/rules --config r/python.lang.correctness steuerbote
