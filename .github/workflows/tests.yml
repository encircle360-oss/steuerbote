name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (without bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build the stub of the ERiC library
        # The tests of the ctypes binding, the worker and the service run against this stub. CI builds it
        # with all warnings as errors and passes its path to the tests, so a missing compiler fails the run
        # instead of skipping them.
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -shared -fPIC -o "$RUNNER_TEMP/libericapi.so" steuerbote/eric/tests/stub/ericapi_stub.c
          echo "STEUERBOTE_ERIC_STUB=$RUNNER_TEMP/libericapi.so" >> "$GITHUB_ENV"

      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Download the ERiC documentation with the XML schemas
        # The schemas may not be passed on, so they are not in the repository: the tests read them from the
        # public documentation zip. 44.3.6.0 is the productive release; 45.1 is a beta with the same 2026 schema.
        env:
          ERIC_DOCUMENTATION: https://download.elster.de/download/eric/eric_44/ERiC-44.3.6.0-Dokumentation.zip
          ERIC_DOCUMENTATION_SHA256: bad21c27ecce56d04fc04bccfd2dfa17b9ff2455aa878758100fc73a28492ad5
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/eric-doc.zip" "$ERIC_DOCUMENTATION"
          echo "$ERIC_DOCUMENTATION_SHA256  $RUNNER_TEMP/eric-doc.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/eric-doc.zip" '*/Datenarten/ElsterAnmeldung/UStVA/*' '*/Datenarten/ElsterExtern/ZMDO/*' '*/Datenarten/ElsterErklaerung/USt/*' '*/Datenarten/ElsterErklaerung/KSt/*' '*/Datenarten/ElsterErklaerung/GewSt/*' '*/Datenarten/ElsterBilanz/*' '*/Datenartversionmatrix.ods' '*/ElsterBasisSchema/*' -d "$RUNNER_TEMP/eric-doc"

      - name: Run the core tests with coverage
        env:
          STEUERBOTE_ERIC_DOC_DIR: ${{ runner.temp }}/eric-doc
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-core
          path: coverage.xml

  frappe:
    name: Frappe site (ERPNext v16)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Build the stub of the ERiC library
        # The tests of the ctypes binding, the worker and the service run against this stub. CI builds it
        # with all warnings as errors and passes its path to the tests, so a missing compiler fails the run
        # instead of skipping them.
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -shared -fPIC -o "$RUNNER_TEMP/libericapi.so" steuerbote/eric/tests/stub/ericapi_stub.c
          echo "STEUERBOTE_ERIC_STUB=$RUNNER_TEMP/libericapi.so" >> "$GITHUB_ENV"

      - name: Set up a bench with Frappe and ERPNext version-16
        run: |
          pip install frappe-bench==5.31.1
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install the app on a test site
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench get-app erpnext --branch version-16
          bench get-app steuerbote "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app steuerbote

      - name: Download the ERiC documentation with the XML schemas
        # The schemas may not be passed on, so they are not in the repository: the tests read them from the
        # public documentation zip. 44.3.6.0 is the productive release; 45.1 is a beta with the same 2026 schema.
        env:
          ERIC_DOCUMENTATION: https://download.elster.de/download/eric/eric_44/ERiC-44.3.6.0-Dokumentation.zip
          ERIC_DOCUMENTATION_SHA256: bad21c27ecce56d04fc04bccfd2dfa17b9ff2455aa878758100fc73a28492ad5
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/eric-doc.zip" "$ERIC_DOCUMENTATION"
          echo "$ERIC_DOCUMENTATION_SHA256  $RUNNER_TEMP/eric-doc.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/eric-doc.zip" '*/Datenarten/ElsterAnmeldung/UStVA/*' '*/Datenarten/ElsterExtern/ZMDO/*' '*/Datenarten/ElsterErklaerung/USt/*' '*/Datenarten/ElsterErklaerung/KSt/*' '*/Datenarten/ElsterErklaerung/GewSt/*' '*/Datenarten/ElsterBilanz/*' '*/Datenartversionmatrix.ods' '*/ElsterBasisSchema/*' -d "$RUNNER_TEMP/eric-doc"

      - name: Run the Frappe tests
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
          STEUERBOTE_ERIC_DOC_DIR: ${{ runner.temp }}/eric-doc
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app steuerbote

      - name: Build the assets of the desk for the browser tests
        # bench init --skip-assets leaves out the bundles of Frappe. They are built without the build commands
        # of Frappe's sub-projects such as Studio, which the desk does not load: seconds instead of the minutes
        # of bench build --app frappe. The cache still holds the assets.json from before the build.
        working-directory: /home/runner/frappe-bench
        run: |
          yarn --cwd apps/frappe run production --apps frappe
          bench compile-po-to-mo --app frappe --locale de
          bench --site test_site clear-cache

      - name: Fill the test site with the data of the browser tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute steuerbote.tests.e2e.seed.run

      - name: Start the test site
        # DEV_SERVER sends the desk to socket.io on its own port, as bench start does, and the default site
        # tells socket.io which site localhost is.
        working-directory: /home/runner/frappe-bench
        run: |
          mkdir -p "$RUNNER_TEMP/browser-results"
          bench use test_site
          DEV_SERVER=1 nohup bench --site test_site serve --port 8000 --noreload > "$RUNNER_TEMP/browser-results/web.log" 2>&1 &
          nohup node apps/frappe/socketio.js > "$RUNNER_TEMP/browser-results/socketio.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://localhost:8000/api/method/ping

      - name: Install Playwright and Chromium
        run: |
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install -r requirements-dev.txt
          "$RUNNER_TEMP/browser-venv/bin/playwright" install --with-deps --only-shell chromium

      - name: Run the browser tests
        run: |
          "$RUNNER_TEMP/browser-venv/bin/python" -m pytest steuerbote/tests/e2e --base-url http://localhost:8000 \
            --output "$RUNNER_TEMP/browser-results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-tests
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: ignore
