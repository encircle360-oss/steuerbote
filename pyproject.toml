[project]
name = "steuerbote"
authors = [{ name = "encircle360 GmbH", email = "oss@encircle360.com" }]
description = "ELSTER tax filings for ERPNext: Umsatzsteuer-Voranmeldung first, year-end filings later"
requires-python = ">=3.14"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed and managed by bench, see [tool.bench.frappe-dependencies]
    # Frappe 16 installs lxml itself without pinning it, so the range only names the major version the
    # ELSTER XML is written for; requirements-dev.txt pins the version the tests run with.
    "lxml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/encircle360-oss/steuerbote"
Repository = "https://github.com/encircle360-oss/steuerbote.git"
"Bug Reports" = "https://github.com/encircle360-oss/steuerbote/issues"

[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# 16.54.0 is the first release whose rate limiter counts per user (user_based), which stash_certificate needs.
frappe = ">=16.54.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # import order
    "UP",  # modern syntax
    "B",   # bugbear
    "RUF", # ruff's own rules
    "S",   # bandit security checks
    "SIM", # simplifications
    "C4",  # comprehensions
    "T20", # no print statements in library code
]
ignore = [
    "E101", # indentation contains mixed spaces and tabs (Frappe uses tabs)
    "W191", # indentation contains tabs
    "E501", # line length is enforced by the formatter
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S314"] # assert is fine in tests, and they parse the XML they produce

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
# Only the pure modules run without a bench; Frappe tests run with `bench run-tests`.
testpaths = [
    "steuerbote/ustva",
    "steuerbote/elster",
    "steuerbote/eric",
    "steuerbote/steuerbote/doctype/annual_filing_settings/test_rules.py",
    "steuerbote/steuerbote/doctype/annual_filing_settings/test_settings_files.py",
    "steuerbote/steuerbote/doctype/annual_filing_settings/test_translations.py",
    "steuerbote/steuerbote/doctype/balance_sheet_mapping/test_balance_sheet_mapping_files.py",
    "steuerbote/steuerbote/doctype/elster_transmission/test_annual_transmission_files.py",
    "steuerbote/steuerbote/doctype/elster_transmission/test_messages.py",
    "steuerbote/steuerbote/doctype/elster_transmission/test_transmission_files.py",
    "steuerbote/steuerbote/doctype/elster_transmission/test_transmission_translations.py",
    "steuerbote/steuerbote/doctype/income_tax_mapping/test_income_tax_mapping_files.py",
    "steuerbote/steuerbote/doctype/recapitulative_statement/test_bridge.py",
    "steuerbote/steuerbote/doctype/recapitulative_statement/test_translations.py",
    "steuerbote/steuerbote/doctype/vat_id_confirmation/test_records.py",
    "steuerbote/steuerbote/doctype/vat_return/test_bridge.py",
    "steuerbote/steuerbote/doctype/vat_return/test_confirmation_files.py",
    "steuerbote/steuerbote/doctype/vat_return/test_plausibility_records.py",
    "steuerbote/steuerbote/doctype/vat_return/test_reconciliation_files.py",
    "steuerbote/steuerbote/doctype/vat_return_extension/test_bridge.py",
    "steuerbote/steuerbote/doctype/vat_return_extension/test_extension_files.py",
    "steuerbote/steuerbote/doctype/vat_return_mapping/test_mapping_form_files.py",
    "steuerbote/steuerbote/doctype/vat_return_settings/test_rules.py",
    "steuerbote/steuerbote/doctype/vat_return_settings/test_translations.py",
    "steuerbote/steuerbote/report/ustva_kennzahlen/test_attribution.py",
    "steuerbote/steuerbote/report/ustva_kennzahlen/test_comparison.py",
    "steuerbote/tests/test_annual_filing_files.py",
    "steuerbote/tests/test_balance_mapping_sync.py",
    "steuerbote/tests/test_income_tax_mapping_sync.py",
    "steuerbote/tests/test_mapping_sync.py",
    "steuerbote/tests/test_setup_files.py",
    "steuerbote/tests/test_standard_records.py",
    "steuerbote/tests/test_workflows.py",
    "steuerbote/dauerfrist",
    "steuerbote/vatid",
    "steuerbote/zm",
    "steuerbote/deadlines",
    "steuerbote/ustjahr",
    "steuerbote/kst",
    "steuerbote/gewst",
    "steuerbote/hgb",
    "steuerbote/setup",
    "steuerbote/mappings",
    "steuerbote/jahresmeldung",
    "steuerbote/xbrl",
    "steuerbote/steuerbote/doctype/annual_vat_return/test_annual_vat_return_files.py",
    "steuerbote/steuerbote/doctype/annual_vat_return/test_bridge.py",
    "steuerbote/steuerbote/doctype/annual_vat_return/test_docs.py",
    "steuerbote/steuerbote/doctype/annual_vat_return/test_layout.py",
    "steuerbote/ebilanz",
    "steuerbote/steuerbote/doctype/corporate_income_tax_return/test_bridge.py",
    "steuerbote/steuerbote/doctype/corporate_income_tax_return/test_docs.py",
    "steuerbote/steuerbote/doctype/corporate_income_tax_return/test_income_tax_files.py",
    "steuerbote/steuerbote/doctype/corporate_income_tax_return/test_income_tax_site_files.py",
    "steuerbote/steuerbote/doctype/corporate_income_tax_return/test_layout.py",
    "steuerbote/steuerbote/doctype/trade_tax_return/test_bridge.py",
    "steuerbote/steuerbote/report/ertragsteuer_kontennachweis/test_attribution.py",
    "steuerbote/steuerbote/doctype/annual_accounts/test_bridge.py",
    "steuerbote/steuerbote/doctype/annual_accounts/test_layout.py",
]
# The store of steuerbote/eric/secrets.py needs Redis and the encryption key of a site.
addopts = "--strict-markers --ignore=steuerbote/eric/tests/test_secrets.py"

[tool.coverage.run]
# The rules of a DocType are named as a module: their directory also holds the controller and its test,
# which import Frappe.
source = [
    "steuerbote/ustva",
    "steuerbote/elster",
    "steuerbote/eric",
    "steuerbote.steuerbote.doctype.annual_filing_settings.rules",
    "steuerbote.steuerbote.doctype.elster_transmission.messages",
    "steuerbote.steuerbote.doctype.recapitulative_statement.bridge",
    "steuerbote.steuerbote.doctype.vat_id_confirmation.records",
    "steuerbote.steuerbote.doctype.vat_return.bridge",
    "steuerbote.steuerbote.doctype.vat_return_extension.bridge",
    "steuerbote.steuerbote.doctype.vat_return_settings.rules",
    "steuerbote.steuerbote.report.ustva_kennzahlen.attribution",
    "steuerbote.steuerbote.report.ustva_kennzahlen.comparison",
    "steuerbote.income_tax_mapping_sync",
    "steuerbote.mapping_sync",
    "steuerbote.balance_mapping_sync",
    "steuerbote/dauerfrist",
    "steuerbote/vatid",
    "steuerbote/zm",
    "steuerbote/deadlines",
    "steuerbote/ustjahr",
    "steuerbote/kst",
    "steuerbote/gewst",
    "steuerbote/hgb",
    "steuerbote/setup",
    "steuerbote/mappings",
    "steuerbote/jahresmeldung",
    "steuerbote/xbrl",
    "steuerbote.steuerbote.doctype.annual_vat_return.bridge",
    "steuerbote.steuerbote.doctype.annual_vat_return.layout",
    "steuerbote/ebilanz",
    "steuerbote.steuerbote.doctype.corporate_income_tax_return.bridge",
    "steuerbote.steuerbote.doctype.corporate_income_tax_return.layout",
    "steuerbote.steuerbote.doctype.trade_tax_return.bridge",
    "steuerbote.steuerbote.report.ertragsteuer_kontennachweis.attribution",
    "steuerbote.steuerbote.doctype.annual_accounts.bridge",
]
omit = ["*/tests/*", "*/steuerbote/eric/secrets.py"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
